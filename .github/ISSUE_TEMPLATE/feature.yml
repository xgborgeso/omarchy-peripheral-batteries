name: Feature
description: A job this plugin should do that it does not.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: job
    attributes:
      label: The job
      description: What a user should be able to see or do. Not a stack.
    validations:
      required: true
  - type: textarea
    id: why-here
    attributes:
      label: Why here
      description: Why this is not already stock Audio, Bluetooth, or omarchy.power.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Remaining runtime from marketing hours, DPI/RGB remap, and vendored binaries are out of scope. See CONTRIBUTING.md.
