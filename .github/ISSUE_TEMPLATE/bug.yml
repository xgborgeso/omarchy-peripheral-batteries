name: Bug
description: Something the panel or helper does wrong.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: Commands, helper JSON, or a sysfs snippet. Redact personal serials.
      render: shell
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      placeholder: "omarchy version"
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Kind of device if you know it. Do not invent a SKU the kernel did not name.
